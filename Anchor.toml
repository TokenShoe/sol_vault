[toolchain]
anchor_version = "1.2.2"
solana_version = "4.1.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
cross_vault = "A38GT8a6E1ySMM91Ly9rNCNbUPfFxLYgUt7X9dFmv2rK"

[programs.devnet]
cross_vault = "A38GT8a6E1ySMM91Ly9rNCNbUPfFxLYgUt7X9dFmv2rK"

[programs.mainnet]
cross_vault = "A38GT8a6E1ySMM91Ly9rNCNbUPfFxLYgUt7X9dFmv2rK"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# Deploy as upgradeable on the test validator, upgrade authority = test wallet (checked by initialize)
[test]
upgradeable = true

# Load CCTP V2 on the local test validator (dumped from devnet: ./scripts/dump-cctp-fixtures.sh)
[[test.genesis]]
address = "CCTPV2vPZJS2u2BBsUoscuikbYjnpFmbFsvVuJdgUMQe"
program = "tests/fixtures/cctp/token_messenger_minter_v2.so"

